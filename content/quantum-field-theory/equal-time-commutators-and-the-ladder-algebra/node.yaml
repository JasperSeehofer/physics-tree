# Granularity (spec v1.2 section 1): one coherent concept, several formulas.
# The single argument is — canonical quantization is a statement about a phase
# space at one instant, so the postulate is equal-time; that one postulate,
# rewritten in the mode basis node 1 built, IS the ladder algebra, and the
# equivalence holds in both directions; therefore there is one postulate here
# and not two, and everything about the theory at unequal times is a
# consequence rather than an input.
#
# Six novel elements relative to the declared prerequisites: (1) the
# equal-time CCR as the field version of [q,p] = i and why "equal-time" is
# forced rather than convenient, (2) the inversion a_k = a functional of phi
# and pi on one time slice, (3) postulate => algebra in the continuum,
# (4) algebra => postulate, the converse, (5) the vanishing of the equal-time
# [phi,phi] as a cancellation rather than a triviality, (6) the unequal-time
# commutator as a computable c-number function, named and handed to node 8.
#
# Splitting was considered and rejected. The natural seam (CCR postulate |
# ladder-algebra equivalence) is exactly escalation node E2 in the M10a map,
# and it fires on probe evidence — item 3 at 0 — not on authoring taste. The
# node's phases are built around a single question, "postulate or result",
# which Phase 1 poses and Phase 2 answers; splitting it would put the
# question in one node and its answer in another.
