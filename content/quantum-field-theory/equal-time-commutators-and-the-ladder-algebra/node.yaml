  - id: harmonic-oscillator-ladder-operators
    kind: recall
    status: external

# Four, under the graduate cap of eight, and exactly the four the M10a map
# places on this node. Two are traceable to graded evidence; two are standard
# graduate errors that this learner's measured profile makes likely here.
misconceptions:
  # [MEASURED] C1 verbatim: "knows the commutator is important and writes
  # [phi-hat(x), phi-hat(y)], but not the equal-time [phi,pi] = i delta^3;
  # creation/annihilation operators named, never constructed." The declared
  # profile signature (recognition intact, production gone). Treated by timed
  # closed-book reconstruction in Phases 3 and 6, per the spec's `fluency_gap`
  # treatment — not by re-explanation.
  - type: fluency_gap
    statement: 'Can say that the commutator is the important structure, but cannot write the equal-time canonical relation between the field and its conjugate momentum with its delta function and its indices'
  # The covariant-looking guess. Structurally forced by what was actually
  # written on the C1 sheet — a general two-argument field commutator — plus a
  # correct instinct that a relativistic theory should have relativistic
  # postulates. Refuted twice in Phase 2: the equal-time restriction of the
  # LHS vanishes identically while delta^4 does not, and the mass dimensions
  # do not match. Covariance is RECOVERED here, not imposed.
  - type: belief
    statement: 'The canonical postulate for a relativistic field must itself be written covariantly, so it is the four-dimensional relation with a delta^4(x-y) on the right-hand side'
  # The node's central target. The two relations look like independent inputs
  # because they are usually presented in sequence with only one direction
  # derived. Both directions are proved in Phase 2's D1 and D2, and Phase 3's
  # Full Example does the converse a second time with nothing assumed.
  - type: conflation
    statement: 'The equal-time field commutator and the ladder-operator commutator are two independent postulates of the theory, one in position space and one in momentum space'
  # [MEASURED class] Three source-interference convention traps already fired
  # on the assessment ledger (asymptotic freedom/flatness B1, Fourier/Legendre
  # C1, mu/Lambda_QCD C4). This is the branch's most consequential one: the
  # (2*pi)^3 in the ladder commutator is not independent of the Fourier
  # convention or of the normalization, and mixing sources propagates the
  # error into every later normalization. Treated with a convention table.
  - type: convention_trap
    statement: 'The factor of (2 pi)^3 in the ladder commutator is a separate convention that can be adopted or dropped independently of the Fourier convention and of the normalization of the mode expansion'

domain_of_applicability:
  - 'Free field only. The equivalence proved here is between the equal-time canonical postulate and the ladder algebra of the modes of a quadratic Hamiltonian. With an interaction the equal-time postulate stands unchanged — it is a statement about the phase space, not about the dynamics — but the operators a_k defined from it are no longer eigenoperators of H, and the mode expansion is at best the asymptotic input to LSZ'
  - 'Bosonic fields. The postulate quantized here is a commutator, and it is the correct choice because the free scalar Hamiltonian is bounded below with commutators and unbounded below with anticommutators. For a spin-1/2 field the opposite holds and the postulate is an anticommutator; the argument that decides which is the spin-statistics theorem, and it is not made here'
  - 'Equal times, on a spacelike slice of flat Minkowski spacetime. The postulate is a statement about a canonical phase space at one instant, and it presupposes a global time function and a global inertial frame. It does not by itself say anything about operators at different times: the unequal-time commutator is a derived quantity'
  - 'Unconstrained systems. The passage from Poisson bracket to commutator assumes the phase space has no constraints relating the fields and their momenta. It fails as written for the electromagnetic field, where the primary constraint pi^0 = 0 makes the naive equal-time postulate inconsistent, and for any gauge theory'
  - 'Says nothing about whether a representation of this algebra is unique, about the domains on which these unbounded operators are defined, or about the sense in which an operator-valued distribution can be commuted with an integral. Those are functional-analysis questions, and they belong to node 4 and to module B2'

