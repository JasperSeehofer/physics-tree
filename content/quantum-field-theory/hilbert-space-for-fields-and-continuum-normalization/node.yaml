# Granularity (spec v1.2 section 1): one coherent concept, several formulas.
# The single argument is — the finite-dimensional Dirac machinery extends to a
# continuous label only through a rigged Hilbert space; momentum and position
# eigenstates are non-normalizable improper vectors living outside H; the
# completeness insertion becomes an integral with a measure fixed by the
# ladder algebra; and therefore every physical statement is about wave
# packets, with the plane wave a distribution one computes with and never a
# state one prepares.
#
# Six novel elements relative to the declared prerequisites: (1) improper
# states and the Gelfand triple Phi in H in Phi', (2) the continuum resolution
# of the identity with its measure, derived from the box, (3) delta
# normalization and the finite quantity <k|k> = V that hides behind the
# infinity, (4) continuous spectrum without eigenvectors, and the approximate-
# eigenvector sense in which a spectral value is still a spectral value,
# (5) wave packets as the physical states, with the plane wave demoted to a
# computational kernel, (6) a_k and phi(x) as operator-valued distributions,
# honest operators only after smearing.
#
# Splitting was considered and rejected. The natural seam (improper states |
# continuum completeness) is exactly escalation node E12 in the M10a map — a
# NEW prerequisite node prepended before this one — and it fires on probe
# evidence, item 1 at 0, not on authoring taste. E12 is also a premise signal
# rather than an ordinary escalation: item 1 at 0 means the assessment's
# "clean productions" list has lost a member, which belongs in the vault
# record before it belongs in the node count. Phase 0's routing says so.
