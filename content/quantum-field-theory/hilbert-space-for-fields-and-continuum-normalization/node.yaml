# Four, under the graduate cap of eight, and exactly the four the M10a map
# places on this node (section 4 node 4, and section 5 rows 8 and 9). Three
# are traceable to a graded sheet; the fourth is a standard graduate error
# that the third makes near-certain here.
misconceptions:
  # [MEASURED] E2 verbatim. The answer is non-normalizability: <x|x> is not
  # finite, so |x> is not a vector in a space whose vectors have finite norm.
  # "Four-dimensional" is a category error about the label, not about the
  # state. M10a section 5 row 8; ledger-typed as a belief already, so no F5
  # translation is needed. This misconception carries the correctness gate in
  # Phase 0.
  - type: belief
    statement: 'A position eigenstate is not in the Hilbert space because it is four-dimensional — the objection is about the dimensionality of the label rather than about the norm of the state'
  # [MEASURED] E2 verbatim: the spectrum of x-hat answered as "we use the
  # energy-eigenstates as spectrum?". The spectrum of x-hat is the real line,
  # it is continuous, and it contains no eigenvalues at all in the strict
  # sense. Treated by explicit contrast in Phase 2's Structural Stage, where
  # spectrum is defined as the support of a measure and eigenbasis as its
  # atomic part. M10a section 5 row 9.
  - type: conflation
    statement: 'The spectrum of an operator is the eigenbasis of whichever operator you happen to be working in — so the spectrum of the position operator can be given as the energy eigenstates'
  # Standard, and forced by the previous one: if spectrum and eigenbasis are
  # the same thing, then every self-adjoint operator must have an eigenbasis.
  # Refuted by counterexample (the hydrogen Hamiltonian's continuum, and the
  # position operator, which has no eigenvectors in H whatsoever) in Phase 3's
  # Mostly Faded Example.
  - type: false_generalisation
    statement: 'Every self-adjoint operator has an orthonormal eigenbasis of normalizable states, because that is what the spectral theorem says in finite dimensions'
  # [MEASURED] E2, and the module's declared profile signature (recognition
  # intact, production gone) in its purest form: the discrete insertion was
  # produced fluently and the continuum one was not produced at all. Treated
  # by timed closed-book reconstruction in Phases 3 and 6, per the spec's
  # `fluency_gap` treatment — not by re-explanation.
  - type: fluency_gap
    statement: 'Can insert a discrete completeness relation instantly and correctly, but cannot write the continuum resolution of the identity with its measure and its delta normalization'

domain_of_applicability:
  - 'Free field, and only the one-particle sector of it. Everything below is computed in the sector spanned by a_k-dagger|0>, where the ladder algebra of node 2 fixes every inner product. The direct-sum structure over all particle numbers, the meaning of the vacuum as a state rather than as a label, and what "particle" is a name for are node 6 and are deliberately not built here'
  - 'Continuum normalization, i.e. infinite spatial volume. In a finite box every state below is an honest normalizable vector and this node has no subject: the improper states are an artefact of the infinite-volume limit, not of quantum mechanics. The Concrete Stage runs the box first for exactly that reason'
  - 'Says nothing about the domain of any operator. Whether a symmetric operator is self-adjoint, what a deficiency index is, and which boundary conditions are self-adjoint extensions are module B2, taught cold before S2.1 (Gate 6, E1/E2 oral). The distinction this node teaches — spectrum versus eigenbasis — is prior to all of that and does not need it'
  - 'Assumes the rigged-triple construction is available, i.e. that there is a nuclear test-function space on which the generalized eigenvectors act. For the free field in Minkowski space there is; the statement that this survives in a general curved background is not made here and is module S2.1'
  - 'The state normalization used below is the naive one, |k> = a_k-dagger|0>, inherited from node 1 which deliberately left the row blank. It is NOT Lorentz covariant, and the covariant alternative differs by sqrt(2 omega_k) per state. Node 5 fixes the row for the branch; every inner product below carries its convention explicitly so that nothing has to be silently re-scaled when it does'

