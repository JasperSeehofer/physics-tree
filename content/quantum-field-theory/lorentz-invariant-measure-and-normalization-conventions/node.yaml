  # the three are not independently choosable.
  - id: equal-time-commutators-and-the-ladder-algebra
    kind: hard
    status: internal
  # Hard, internal. Node 4 established that |k> is improper, delta-normalized
  # and only ever used under an integral; this node asks which delta
  # normalization is covariant. Without node 4 the question "what is the
  # normalization of a state that has infinite norm" is not even well posed.
  - id: hilbert-space-for-fields-and-continuum-normalization
    kind: hard
    status: internal
  # Hard, external, and genuinely hard here rather than recall: the node's
  # first derivation is a statement about the invariance of d^4k, of
  # delta(k^2-m^2) and of theta(k^0) under proper orthochronous
  # transformations, and its second is an explicit boost of a three-volume.
  # Neither is readable if four-vectors are only a notation.
  - id: special-relativity-four-vectors
    kind: hard
    status: external

# Four, under the graduate cap of eight, and exactly the four the M10a map
# places on this node. Two are traceable to measured classes on the ledger;
# the geometry-basin one is a measured attractor with five firings.
misconceptions:
  # [MEASURED class] Three source-interference convention traps have fired on
  # the assessment ledger. This is the branch's most expensive one, because
  # unlike the others it produces no wrong-looking symbol: a mixed pair gives
  # a perfectly sensible formula that is wrong by a factor of 2E per leg.
  # Treated with the master convention table and the mechanical identity
  # |S|^2 C = 2*omega_k*(2*pi)^3, which is checkable in fifteen seconds.
  - type: convention_trap
    statement: 'Normalization conventions are cosmetic, so a formula from one source can be dropped into a calculation set up with another source conventions'
  # [MEASURED attractor, geometry basin, 5 firings: A5 "Lie derivative needs
  # the metric", C5 written "measure = ds^2", node-probe item 6 "bundle metric
  # = Minkowski", node-probe item 3 "connection axioms -> geometric trinity",
  # C5 oral "the measure is the lapse"]. The word "invariant measure" is the
  # trigger: in this learner's geometry past an invariant measure IS
  # sqrt(-g) d^4x. Here it is a measure on the mass shell in momentum space,
  # the background is flat, and sqrt(-g) = 1 identically. Treated by explicit
  # contrast in Phase 2 and as a distractor in every relevant quiz item.
  - type: conflation
    statement: 'The Lorentz-invariant measure is a metric determinant: the factor accompanying the momentum integral is the sqrt(-g) that makes a volume element coordinate-independent'
  # Standard, and the precise failure the derivation is built to expose:
  # delta functions are not automatically invariant, because a delta carries
  # the inverse Jacobian of whatever it is a delta of. The three-dimensional
  # delta is not invariant; 2E times it is.
  - type: false_generalisation
    statement: 'The three-momentum delta function is Lorentz invariant because delta functions are defined by an integral and integrals are invariant'
  # [MEASURED on-ramp, inverted into a target] The BA thesis hand-derived a
  # 2->3 invariant phase-space integral, so the measure is recognisable on
  # sight; the derivation from the on-shell delta is what was never done.
  # Treated by timed closed-book reconstruction in Phases 3 and 6, per the
  # spec's `fluency_gap` treatment — not by re-explanation.
  - type: fluency_gap
    statement: 'Can recognise the invariant measure on sight and use it in a phase-space integral, but cannot derive it from the on-shell delta function or say which of its factors are forced'

domain_of_applicability:
  - 'Massive, on-shell, positive-energy states: the derivation solves k^2 = m^2 for k^0 and keeps the positive root via theta(k^0). For m = 0 the hyperboloid degenerates to the light cone and the measure still works, but the vertex k = 0 is a genuinely singular point of the orbit and the massless little group is different — node 7 and module B1'
  - 'Proper orthochronous Lorentz transformations only. Invariance of theta(k^0) uses the preservation of the sign of the energy, which fails for time reversal, and invariance of d^4k uses |det Lambda| = 1, which holds for all four components but is only half the story'
  - 'Flat Minkowski spacetime. The invariance proved here is invariance under a global symmetry group of the background. In a curved spacetime there is no such group, no preferred mass shell in a global sense, and the whole notion of a covariantly normalized one-particle state is what module S2.1 questions'
  - 'Free field. The mass shell is the exact support of the one-particle states only for a free theory; for an interacting field the spectral density is broader than a delta and the pole picks up a residue Z, which is node 22 and module S1.2'
  - 'A convention statement, not a physics statement. Every choice below is a choice; what is NOT a choice is consistency, and the node claims only that. Any source obeying the identity |S|^2 C = 2 omega_k (2 pi)^3 with its own S and C is as correct as this branch'

