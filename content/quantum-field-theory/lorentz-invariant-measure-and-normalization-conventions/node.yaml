# Granularity (spec v1.2 section 1): one coherent concept, several formulas.
# The single argument is — d^3k is not Lorentz invariant and d^3k/2E is; that
# one fact fixes the measure in every momentum integral in the rest of the
# module; the freedom to move the sqrt(2E) between the state, the operator and
# the measure is exactly the freedom in which sources differ; and a convention
# is wrong only when it is mixed.
#
# Six novel elements relative to the declared prerequisites: (1) the on-shell
# delta identity and the invariant measure derived from it, (2) the
# non-invariance of d^3k and of delta^3, with the compensating 2E computed
# from an explicit boost, (3) relativistic state normalization and the
# covariant resolution of the identity, (4) <0|phi(x)|k> = e^{-ikx} as the
# statement that fixes which normalization deserves the name, (5) the single
# consistency identity |S|^2 C = 2 omega_k (2 pi)^3 relating all three
# convention slots, (6) invariant n-body phase space as the object the
# learner already hand-derived in 2022.
#
# Splitting was considered and rejected. The natural seam (derivation of the
# measure | full source-convention comparison) is exactly escalation node E3
# in the M10a map, and it fires on probe evidence — any two convention errors
# logged across nodes 1-5 — not on authoring taste. The node's phases are
# built around one question, "which of these can be mixed with which", which
# Phase 1 poses numerically and Phase 3 answers as a table.
