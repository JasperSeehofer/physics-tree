concept_id: lorentz-invariant-measure-and-normalization-conventions
title: 'The Invariant Measure and Where the Square Root of 2E Goes'

# EQF 7. The node assumes nodes 1, 2 and 4 plus a physics master's worth of
# special relativity, and builds on neither beyond master's level.
eqf_level: 7

# Declared, not inferred, for the same three reasons nodes 1-4 declare it: the
# misconception cap of 8, the mandatory calibration probe (this module's
# routing instrument), and the phase gate — which Gate 6 has ratified OFF for
# S0.5 and which is therefore overridden in content. See the header.
tier: graduate
