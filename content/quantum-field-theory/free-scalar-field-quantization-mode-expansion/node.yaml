node_type: concept
depth_tier: trunk

# Granularity (spec v1.2 section 1): one coherent concept, several formulas.
# The single argument is — a field is a continuum of degrees of freedom that
# the gradient term couples, so it cannot be quantized point by point; the
# coupling is translation-invariant, so the Fourier transform (not a Legendre
# transform) block-diagonalizes it; each block is an ordinary harmonic
# oscillator with frequency omega_k = sqrt(k^2 + m^2); therefore quantizing the
# field IS quantizing infinitely many oscillators, and the field operator is
# the superposition of their ladder operators.
#
# Seven novel elements relative to the declared prerequisites: (1) the field as
# coupled degrees of freedom and the gradient term as the coupling, (2) Fourier
# as the normal-mode transform, contrasted with Legendre, (3) omega_k =
# sqrt(k^2+m^2) as a dispersion relation that *is* the relativistic energy,
# (4) the per-mode ladder operators constructed rather than named, (5) the mode
# expansion as an operator identity with its measure and normalization, (6) H
# diagonal in the number operators, (7) the reality constraint
# phi-tilde(-k) = phi-tilde-dagger(k) and what it does to the naive count of
# one independent oscillator per k.
#
# Splitting was considered and rejected for this node as authored. The natural
# seam (classical field + conjugate momentum | mode expansion + ladder
# operators) is exactly escalation node E1 in the M10a map, and it fires on
# probe evidence — items 2 and 4 both at 0 — not on authoring taste. Splitting
# it pre-emptively would put the Phase-1 struggle (the continuum does not
# decouple point by point) in a different node from its own gap reveal (Fourier
# is what decouples it), which is the one cut the spec's granularity rule names
# as forbidden.
