# Five, under the graduate cap of eight, and exactly the five the M10a map
# places on this node. Three are verbatim from probe C1 (2026-08-16); one is a
# standard graduate error the C1 sheet's framing makes near-certain here; one
# is predicted and labelled as such wherever it appears in the node text.
misconceptions:
  # [MEASURED] C1 verbatim: momentum space reached "via Legendre transform".
  # The Fourier<->Legendre term collision, one of three convention traps in the
  # assessment ledger, all three of them QCD-past source interference. Treated
  # with a two-row table separating the transforms by which variable each one
  # trades away. This misconception carries a correctness gate in Phase 0.
  - type: convention_trap
    statement: 'Momentum space is reached from position space by a Legendre transform, the same operation that takes the Lagrangian to the Hamiltonian'
  # [MEASURED] C1 verbatim framing: "first quantization phi -> phi-hat as
  # x -> x-hat". Declared here because it is the frame the learner arrives
  # carrying and this node is where it first does damage; the positive
  # resolution is node 6 (fock-space-and-the-particle-interpretation), which
  # this node forward-links rather than pre-empts.
  - type: conflation
    statement: 'Quantizing a field is second quantization: you promote phi to an operator the way you promoted x to an operator, so the field is a wavefunction that has been quantized twice'
  # Predicted-adjacent but structurally forced by the way the expansion is
  # usually first met (as a solution of the classical Klein-Gordon equation).
  # The a_k are operators and the expansion is an operator identity; if they
  # are read as integration constants, nothing in nodes 2-6 can land.
  - type: belief
    statement: 'The mode expansion is a solution ansatz for the classical field equation, so the coefficients a_k are integration constants fixed by initial data'
  # [MEASURED] C1: "creation/annihilation operators named, never constructed".
  # The declared profile signature of this learner (recognition intact,
  # production gone). Treated by timed closed-book reconstruction in Phase 3
  # and Phase 6, per the spec's `fluency_gap` treatment — not by re-explanation.
  - type: fluency_gap
    statement: 'Can name the creation and annihilation operators, but cannot write the mode expansion with its measure and its normalization factor from memory'
  # [PREDICTED]. Not measured on any sheet — but it sits squarely inside this
  # learner's measured trap class (three source-interference convention traps
  # already fired) and it is the single most common silent factor error in
  # free-field QFT. Labelled as predicted in phase-2.md's Conventions table.
  - type: convention_trap
    statement: 'The normalization factor in the mode expansion is 1/sqrt(2 omega_k) in every source, so a formula can be copied between textbooks without checking where the sqrt(2 omega) has been absorbed'

domain_of_applicability:
  - 'Free field only: the Lagrangian is quadratic, so the Heisenberg equations are linear and the mode operators a_k are time-independent up to the phase e^{-i omega_k t}. Any interaction term destroys this — a_k(t) is then not a_k e^{-i omega t}, the number operator is not conserved, and the expansion below is at best an asymptotic input to LSZ'
  - 'Flat Minkowski spacetime with a global inertial frame: the split of the expansion into positive- and negative-frequency parts uses a globally defined timelike Killing vector to define "frequency". In a general curved spacetime, or for an accelerated observer, no preferred split exists and hence no preferred vacuum — this is the Unruh/Hawking territory of module S2.1 and is not treated here'
  - 'Spatial translation invariance: the Fourier transform diagonalizes the Hamiltonian because plane waves are the irreducible representations of the translation group the Lagrangian is invariant under. A position-dependent mass or coupling breaks this and no amount of Fourier analysis will decouple the modes'
  - 'Real (Hermitian) scalar field with m^2 > 0. Real means one operator a_k per momentum rather than two, hence no conserved charge and no distinct antiparticle; m^2 < 0 makes omega_k imaginary for small k, the expansion in these modes is not a valid oscillator basis, and the correct treatment is spontaneous symmetry breaking about a different minimum'
  - 'Infinite spatial volume with continuum-normalized states. The operators a_k are operator-valued distributions, not operators on the Fock space, and expressions such as delta^3(0) that appear when they are multiplied at coincident momenta are symptoms of that, not of a physical infinity. The finite-box regularization in Phase 3 is the honest way to see which statements survive the limit'
  - 'Says nothing about superpositions of geometries, about a field on a background that is itself dynamical, or about whether the mode decomposition survives when the spacetime has no global Cauchy slicing'

