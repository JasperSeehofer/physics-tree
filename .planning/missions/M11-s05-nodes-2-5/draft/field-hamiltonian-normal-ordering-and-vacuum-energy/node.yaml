concept_id: field-hamiltonian-normal-ordering-and-vacuum-energy
title: 'The Field Hamiltonian, Normal Ordering, and the Zero-Point Divergence'

# EQF 7. Assumes nodes 1 and 2 plus a physics master's worth of statistical
# and analytical mechanics; builds on none of it beyond master's level.
eqf_level: 7

# Declared, not inferred, for the same three reasons as nodes 1 and 2: the
# misconception cap of 8, the mandatory calibration probe, and the phase gate,
# which Gate 6 ratified OFF for S0.5 and which is overridden in content here.
tier: graduate

# Floor, not profile. `remember` for the diagonal H, `apply` for the
# normal-ordering operation, `analyze` for "which infinity is which",
# `evaluate` for "what licenses the subtraction and where does the licence
# stop". The per-learner profile is what the Phase-0 probe measures.
bloom_minimum: evaluate

prerequisites:
  # Hard, internal. The mode expansion, the diagonalization of H, and the
  # explicit appearance of the divergent c-number in its D3 are all node 1's.
  # This node begins where that derivation stopped.
  - id: free-scalar-field-quantization-mode-expansion
    kind: hard
    status: internal
  # Hard, internal. The reordering that produces the c-number IS the ladder
  # commutator, evaluated at coincident momenta — so the object being
  # subtracted here is node 2's right-hand side used outside its domain, and
  # the delta^3(0) cannot be read honestly without node 2.
  - id: equal-time-commutators-and-the-ladder-algebra
    kind: hard
    status: internal
  # Recall, not instruction. Needed for two things: that H is the Noether
  # charge of time translation (so a c-number shift in H is a shift of the
  # conserved quantity, not of the symmetry), and that the same construction
  # gives P, whose would-be c-number vanishes by parity — the contrast that
  # shows the anomaly is specific to the energy.
  - id: noethers-theorem
    kind: recall
    status: external

# Four, under the graduate cap of eight, and exactly the four the M10a map
# places on this node. None is verbatim-measured; all four are standard
# graduate errors, and two of them (the first and second) are made more
# likely, not less, by this learner's genuine general-relativity substrate.
misconceptions:
  # The commonest reaction to normal ordering, and the one this learner's GR
  # background makes almost inevitable: if everything gravitates, subtracting
  # an energy looks like cheating. Refuted by the precise statement of what
  # the subtraction changes (nothing observable in a non-gravitating theory)
  # and by the observation that the Casimir effect measures a DIFFERENCE.
  - type: belief
    statement: 'Normal ordering removes a real physical energy that is actually there, so the zero-point energy is being swept under the rug by a choice of notation'
  # The mirror error, and the one that costs more later. Normal ordering is
  # defined relative to a chosen set of a_k, i.e. relative to a chosen vacuum,
  # and a background with no preferred vacuum has no preferred normal ordering.
  # Treated by domain_of_applicability and forward-linked to S2.1.
  - type: scope_violation
    statement: 'Normal ordering is always available: any divergent vacuum contribution in any theory or background can be removed by defining it away'
  # True INSIDE the normal-ordering symbol and false outside it, which is
  # exactly the structure that makes it dangerous. Treated with the
  # counterexample phi(x)phi(y) = :phi(x)phi(y): + <0|phi(x)phi(y)|0>, whose
  # second term is the seed of Wick's theorem (node 19).
  - type: false_generalisation
    statement: 'Normal-ordered products are symmetric, :AB: = :BA:, so operator ordering never matters once normal ordering has been introduced'
  # The node's sharpest distinction. This divergence is an ADDITIVE c-number,
  # removable once and for all by a definition, and it does not renormalize any
  # coupling or field. The divergences of S1.2 are none of those things.
  # Treated with an explicit contrast table.
  - type: conflation
    statement: 'The zero-point divergence removed by normal ordering is the same kind of divergence that renormalization deals with in loop diagrams'

domain_of_applicability:
  - 'Free field only. For a quadratic Hamiltonian the vacuum contribution is exactly an additive c-number and normal ordering removes all of it once. With interactions the vacuum energy receives further contributions order by order, normal ordering the interaction term does not remove them, and the statement that survives is only that the vacuum energy is unobservable in a non-gravitating theory'
  - 'Non-gravitating physics. The subtraction is legitimate precisely because nothing in this theory couples to the absolute value of the energy, only to differences. Gravity couples to the full stress-energy tensor, so the same c-number that is invisible here is a source term in the Einstein equations, and no argument given in this node survives that step'
  - 'A background with a preferred vacuum. Normal ordering is defined relative to a chosen split of the field into positive- and negative-frequency parts, which is a choice of the operators a_k, which is a choice of vacuum. In a general curved spacetime or for an accelerated observer no such choice is preferred, so ":" is observer-dependent and there is no invariant vacuum energy to subtract'
  - 'Additive, c-number divergences only. What is removed here is a multiple of the identity, fixed once, requiring no redefinition of any coupling, field or mass. It says nothing about the multiplicative divergences of loop corrections, and nothing about the renormalization of composite operators at coincident points'
  - 'Says nothing about whether the vacuum energy is "really there". The node establishes what the theory predicts, what is measurable, and where the question becomes physical again; it does not settle the interpretation, and the honest position is that the cosmological-constant problem is open'

