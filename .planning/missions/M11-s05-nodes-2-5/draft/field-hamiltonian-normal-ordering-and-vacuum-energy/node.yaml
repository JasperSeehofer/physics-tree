# Granularity (spec v1.2 section 1): one coherent concept, several formulas.
# The single argument is — substituting the mode expansion into H produces a
# sensible operator plus a divergent c-number; the c-number is a multiple of
# the identity, so subtracting it changes no commutator, no equation of motion
# and no energy difference; therefore the subtraction is legitimate EXACTLY
# WHEN only differences couple to anything, and the one interaction that
# couples to the absolute value is gravity — which is why the most trivially
# removable infinity in the theory becomes, once the background is allowed to
# respond, the worst quantitative failure in physics.
#
# Six novel elements relative to the declared prerequisites: (1) the c-number
# isolated and identified as an energy density times a volume, two logically
# separate infinities; (2) delta^3(0) = V/(2pi)^3 as the volume in disguise;
# (3) the normal-ordering operation and :H:; (4) the contrast with the momentum
# operator, whose would-be c-number vanishes by parity, showing the anomaly is
# specific to the energy; (5) the identity phi phi = :phi phi: + <0|phi phi|0>
# and its consequence for ordering; (6) the exact domain of the subtraction
# licence, and its failure under gravity.
#
# Splitting was considered and rejected. The natural seam (the derivation of
# the divergence | the justification of the subtraction) puts the Phase-1
# struggle in one node and its resolution in another, which is the one cut the
# spec's granularity rule names as forbidden — and the whole point of the node
# is that the two halves are the same question asked twice.
