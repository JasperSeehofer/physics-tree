concept_id: parallel-transport-covariant-derivative
title: 'Parallel Transport and the Covariant Derivative'

# S-2 RESOLVED: eqf_level range is now 2-8. This is the entry node of a track
# whose later nodes (spin foams, asymptotic safety, functional RG) are EQF 8;
# at 7 it no longer sits at the ceiling of the scale.
