# S-3 PARTIALLY RESOLVED: a scalar Bloom level is still a fiction for this node
# (apply/analyze for index gymnastics, evaluate for the geometric trinity,
# remember for the bundle-theoretic definition). The per-learner profile is now
# measured by the Phase-0 calibration probe instead of asserted here; this field
# records the node's floor.
