# S-5 RESOLVED: cap raised to 8 at graduate tier and entries typed. All eight
# error modes M1b identified are now declarable; five of these had to be dropped
# under the v1.0 cap of 3, including two that survive into published research
# (the normal-coordinates one and the index-order one).
misconceptions:
  - type: false_generalisation
    statement: 'The Christoffel symbols are the components of a tensor, because they carry indices and can be raised and lowered with the metric'
  - type: belief
    statement: 'A manifold with a metric has exactly one derivative operator, so the connection is determined by the geometry rather than chosen'
  - type: belief
    statement: 'Parallel transport is path-independent as long as you stay inside a single coordinate chart'
  - type: conflation
    statement: 'The covariant derivative and the Lie derivative are two notations for the same operation'
  - type: false_generalisation
    statement: 'Normal coordinates make the Christoffel symbols vanish in a whole neighbourhood, not just at a point'
  - type: false_generalisation
    statement: 'The covariant derivative of a tensor density is given by the same formula as for a tensor'
  - type: belief
    statement: 'Torsion is a small correction to general relativity rather than an independent choice of connection'
  - type: convention_trap
    statement: 'Index order in Gamma^rho_{mu nu} does not matter because it is symmetric — true only for Levi-Civita'

# Unchanged from the draft: M1b found this the best-fitting field in the whole
# schema at graduate level, and the one that needed no change.
domain_of_applicability:
  - 'Valid on any smooth manifold carrying an affine connection; a metric is NOT required to define the covariant derivative'
  - 'The Levi-Civita specialisation is valid only under metric compatibility AND vanishing torsion; drop either and you get teleparallel or metric-affine geometry instead'
  - 'Valid for tensor fields on the tangent bundle; spinor fields require the spin connection on the frame bundle and are out of scope for this node'
  - 'Classical smooth regime only: assumes a fixed differentiable manifold. Makes no statement about superpositions of geometries, discrete spectra of geometric operators, or sub-Planckian smoothness'

esco_tags: []

