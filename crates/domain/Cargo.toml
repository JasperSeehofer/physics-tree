[package]
name = "domain"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }

[dev-dependencies]
# Unconditional in tests so the untagged node.yaml entry shapes (Misconception,
# Prerequisite) are exercised by a plain `cargo test --workspace`, not only
# under --all-features.
serde_json = { workspace = true }
# The parser the validate and ingest binaries actually use. Needed in domain's
# tests because `relaxation: off` (v1.3) is a YAML 1.1 boolean: whether the
# field survives the real parser is not a question serde_json can answer.
serde-saphyr = { workspace = true }

[features]
default = []
ssr = ["sqlx", "serde_json", "pulldown-cmark"]
